name: nightly-nav-append

on:
  schedule:
    - cron: "0 21 * * *"     # 21:00 UTC = 02:30 IST — AMFI's file is final by then
  workflow_dispatch: {}       # manual runs for testing and catch-up

permissions:
  contents: write             # gh release upload needs it

jobs:
  append:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The parser is the single point of failure for this pipeline, and it
      # failed silently for five days in Aug 2026. Two seconds of tests before
      # each run is cheap insurance against shipping that twice.
      - name: Parser tests
        run: |
          pip install --quiet pytest
          python -m pytest tests/ -q

      - name: Append today's NAVs from AMFI
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/nightly.py

  # GitHub disables scheduled workflows after 60 days with no commits, and this
  # repo ships data as release assets, so it never commits on its own (warning
  # email, 17 Oct 2026). Re-enabling the already-enabled workflow each run
  # resets that clock without adding commits. Separate job: it needs only
  # actions:write, and a failure here can never block the NAV append.
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      actions: write
    steps:
      - name: Keep the schedule from being auto-disabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/nightly.yml/enable"
